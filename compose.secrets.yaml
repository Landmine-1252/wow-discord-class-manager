# Set DISCORD_BOT_TOKEN empty in .env; create ./secrets/discord_bot_token.
services:
  bot:
    environment:
      DISCORD_BOT_TOKEN: ""
      DISCORD_BOT_TOKEN_FILE: /run/secrets/discord_bot_token
    secrets:
      - discord_bot_token

secrets:
  discord_bot_token:
    file: ./secrets/discord_bot_token
